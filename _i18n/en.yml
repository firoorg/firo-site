private:
  heading: "Your money is nobody's business"
  lead: "Most cryptocurrencies expose your balance and payment history on a public ledger. In Firo’s official wallets, Spark makes private payments the default."
  cta: "Get a private wallet"
  sparktitle: "Lelantus Spark"
  sparktext: "Firo’s privacy protocol for direct payments. Spark hides the sender, recipient, and amount from public ledger observers, while zero-knowledge proofs let the network verify every transaction without requiring a trusted setup."
  sparklink: "Read the research"
  balancestitle: "Private balances and Payments"
  balancestext: "Spark addresses cannot be searched on the blockchain like ordinary public addresses. Funds held and payments made with Spark stay out of public view, while view keys let you share transaction information when you choose."
  anonsettitle: "Large, overlapping anonymity sets"
  anonsettext: "Each Spark spend is hidden among a large set of possible coins. These sets are arranged as overlapping windows, so a new set carries privacy forward from the previous one instead of starting with an empty crowd. The more Spark activity, the larger the crowd to hide in."
  opentitle: "Privacy built to be understood and to last."
  opentext: "Private money should not depend on a single company or a small circle of experts. Spark combines established cryptographic building blocks, published research, open-source code, and a modular design to make independent scrutiny and long-term maintenance practical."
  comparetitle: "Design choices you can check"
  comparelead: "Privacy you cannot inspect is privacy you have to take on trust. Here is how Spark is built, and what each choice makes possible."
