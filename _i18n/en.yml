ecosystem:
  heading: "Privacy that reaches further"
  lead: "Firo's privacy doesn't stop at FIRO. It can carry new tokens, reach other chains, and trade without giving up custody, bringing strong privacy to a wider slice of crypto."
  cta: "Explore Spark Assets"
  cta2: "Read the research"
  spatseyebrow: "The centerpiece"
  spatstitle: "Spark Assets"
  spatstagline: "Create your own confidential token on Firo."
  spatstext1: "Spark Assets, or Spats, extends Lelantus Spark, the privacy engine behind FIRO, so it can protect more than just FIRO. You can create your own token directly on the Firo blockchain, and it lives there as a Spark Asset with the same strong privacy FIRO already has."
  spatstext2: "That turns Firo into a place to issue and hold confidential tokens, each one private by default, all on one chain."
  callouttitle: "Every token hides the others"
  callouttext: "Here is the part that makes it powerful: every Spark Asset is indistinguishable from every other asset or even Firo.  A transaction sending Token A looks exactly like one sending Token B. So every payment on the Spats layer helps hide every other one, and the more tokens and activity it carries, the stronger privacy gets for everyone."
  roseneyebrow: "Reach"
  rosentitle: "RosenBridge"
  rosentext1: "Privacy coins need censorship resistant liquidity. RosenBridge connects FIRO to other blockchains. When FIRO crosses the bridge, the native coin is locked and an equal amount of rsFIRO (Rosen-wrapped FIRO) is minted as a standard token on the target chain, such as Ethereum or BNB Chain allowing it to participate in its rich and liquid DeFi ecosystems."
  rosentext2: "RosenBridge does not depend on one exchange or custodian. Its design spreads responsibility across independent participants, making it harder for any single entity to block access to FIRO."
  firodexeyebrow: "Trade"
  firodextitle: "Atomic swap DEXes"
  firodextext1: "FiroDEX and BasicSwap let you trade FIRO directly with another person. They use atomic swaps, which means you keep custody of your coins the whole time: no account to open, no company holding your funds."
  firodextext2: "It is how you swap into and out of FIRO without trusting a centralized exchange, keeping the self-custody spirit of private money intact."
  closingtitle: "A growing ecosystem"
  closingtext: "Spark Assets, RosenBridge, and FiroDEX are the first pieces. More ways to use and connect Firo's privacy are on the way."
  closingcta: "Get involved"
  nextlead: "Ecosystem is one side of Firo. Here are the other two."
  nextcta: "Get involved"

