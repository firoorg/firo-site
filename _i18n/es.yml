ecosystem:
  heading: "Privacidad que llega más lejos"
  lead: "La privacidad de Firo no se queda en FIRO. Puede albergar nuevos tokens, llegar a otras cadenas e intercambiarse sin ceder la custodia, llevando una privacidad sólida a una parte más amplia del mundo cripto."
  cta: "Explora Spark Assets"
  cta2: "Lee la investigación"
  spatseyebrow: "La pieza central"
  spatstitle: "Spark Assets"
  spatstagline: "Crea tu propio token confidencial en Firo."
  spatstext1: "Spark Assets, o Spats, amplía Lelantus Spark, el motor de privacidad de FIRO, para que pueda proteger algo más que FIRO. Puedes crear tu propio token directamente en la blockchain de Firo, y vivirá allí como un Spark Asset con la misma privacidad sólida que ya tiene FIRO."
  spatstext2: "Eso convierte a Firo en un lugar donde emitir y guardar tokens confidenciales, cada uno privado por defecto y todos en una misma cadena."
  callouttitle: "Cada token oculta a los demás"
  callouttext: "Esta es la parte que lo hace tan potente: cada Spark Asset es indistinguible de cualquier otro activo, incluso de Firo. Una transacción que envía el token A es exactamente igual que una que envía el token B. Así, cada pago en la capa de Spats ayuda a ocultar todos los demás, y cuantos más tokens y actividad soporta, más fuerte es la privacidad para todos."
  roseneyebrow: "Alcance"
  rosentitle: "RosenBridge"
  rosentext1: "Las monedas de privacidad necesitan liquidez resistente a la censura. RosenBridge conecta FIRO con otras blockchains. Cuando FIRO cruza el puente, la moneda nativa se bloquea y se emite una cantidad equivalente de rsFIRO (FIRO envuelto por Rosen) como token estándar en la cadena de destino, como Ethereum o BNB Chain, lo que le permite participar en sus ecosistemas DeFi, ricos y con mucha liquidez."
  rosentext2: "RosenBridge no depende de un único exchange o custodio. Su diseño reparte la responsabilidad entre participantes independientes, lo que dificulta que una sola entidad bloquee el acceso a FIRO."
  firodexeyebrow: "Intercambio"
  firodextitle: "DEX de intercambio atómico"
  firodextext1: "FiroDEX y BasicSwap te permiten intercambiar FIRO directamente con otra persona. Usan intercambios atómicos, lo que significa que mantienes la custodia de tus monedas en todo momento: sin cuenta que abrir ni empresa que guarde tus fondos."
  firodextext2: "Es la forma de entrar y salir de FIRO sin confiar en un exchange centralizado, manteniendo intacto el espíritu de autocustodia del dinero privado."
  closingtitle: "Un ecosistema en crecimiento"
  closingtext: "Spark Assets, RosenBridge y FiroDEX son las primeras piezas. Vienen más formas de usar y conectar la privacidad de Firo."
  closingcta: "Participa"
  nextlead: "Ecosistema es una de las caras de Firo. Estas son las otras dos."
  nextcta: "Participa"

