  jumpdefi: "DeFi (rsFIRO)"
  defititle: "Plataformas DeFi"
  defitext: "Estas plataformas operan con rsFIRO, una versión envuelta de FIRO que existe en Ethereum y BNB Chain gracias a RosenBridge. No es la moneda nativa: para usar las funciones de privacidad de Firo, devuelve tus rsFIRO a la cadena de Firo a través del puente."
  contractslabel: "Contratos del token rsFIRO. Comprueba siempre la dirección antes de operar."
  
tech:
  heading: Investigación
  heading1: La privacidad consiste en ir siempre un paso por delante. El equipo detrás de Firo es responsable de algunos de los protocolos de privacidad para blockchain más importantes de la historia, y toda esa tecnología se condensa en Firo.
  academicpapers: Artículos académicos
  audits: Auditorías
  sparklelantus1: Tecnología Lelantus Spark
  sparklelantus2: "Lelantus Spark mejora enormemente a su predecesor, Lelantus, con direcciones Spark flexibles que ocultan todos los importes de las transacciones y no pueden buscarse en la blockchain, a la vez que permiten firmas de umbral eficientes y claves de visualización tanto de entrada como de salida. Spark también tiene una estructura modular que permite actualizar sus componentes a medida que surge mejor tecnología y que simplifica el análisis de seguridad. Conserva las ventajas de Lelantus: no necesita configuración de confianza, tiene una construcción fácil de entender y se basa en supuestos criptográficos bien establecidos."
  lelantus1: Tecnología Lelantus
  lelantus2: Lelantus es un protocolo de privacidad de nueva generación desarrollado por Aram Jivanyan en Firo. Lelantus te permite quemar tus monedas, lo que las oculta en un conjunto de anonimato de más de 65.000. El receptor puede canjearlas desde este fondo de anonimato, lo que rompe los vínculos con tu transacción y con todas las anteriores por las que han pasado.
  sigma1: Tecnología Sigma
  sigma2: Creemos que el propósito de la blockchain es construir sistemas que no requieran confianza, y ese mismo principio se aplica a nuestros sistemas de privacidad. Por eso creamos Sigma para Zcoin en 2018, que elimina la necesidad de una configuración de confianza en Zerocoin. Sigma usa curvas ECC de 256 bits para lograr pruebas de solo 1,5 kB, una mejora de 17 veces respecto a la tecnología de la época. Sigma fue la precursora de Lelantus y sentó muchas de las bases que nos han traído hasta aquí.
  dandelion1: Tecnología Dandelion
  dandelion2: Dandelion++ protege tu dirección IP. Antes de difundir las transacciones de Firo a toda la red, se pasan entre nodos durante un número aleatorio de saltos. Así, el origen de la difusión queda desvinculado de tu dirección IP.
  mtp1: Seguridad descentralizada y justa
  mtp2: El algoritmo de minería Merkle Tree Proof (MTP) de Firo se diseñó para democratizar la minería. El algoritmo MTP hace un uso intensivo de la memoria, lo que encarece la fabricación de ASIC y mantiene la cadena minable con hardware de consumo como las GPU. Los nodos, sin embargo, pueden prescindir de este requisito de memoria y verificar estas pruebas de forma eficiente. Una auditoría patrocinada por Firo en 2017 demostró la eficacia de este doble enfoque. Desde entonces, MTP ha sido sustituido por FiroPoW, que tiene pruebas más pequeñas y estrategias adicionales de resistencia a los ASIC.
  
team:
  heading: Equipo
  founders: fundadores
  coreteam: desarrolladores principales
  mobileteam: desarrollo móvil
  research: investigación
  community: comunidad
  poramininsom:
    name: Poramin Insom
    title: Cofundador
    bio: Poramin Insom fundó Zcoin (ahora Firo) en 2016 con el objetivo de ofrecer privacidad financiera y una minería más inclusiva mediante una prueba de trabajo resistente a los ASIC. Obtuvo un máster en Seguridad de la Información por la Universidad Johns Hopkins, donde escribió un artículo sobre una propuesta de implementación práctica del protocolo Zerocoin. Sentó las bases de la tecnología de Zcoin (ahora Firo), desde programar la primera implementación de Zerocoin del mundo hasta impulsar la investigación y el desarrollo del algoritmo de minería MTP. Poramin se ha centrado en impulsar la adopción de Firo en el mundo real, sobre todo con su participación para que el Partido Demócrata de Tailandia celebrara en 2018 en la blockchain de Firo las primarias para elegir a su líder, la primera elección política a gran escala del mundo en una blockchain. También sirvió en el ejército tailandés, donde estuvo a cargo de la ciberguerra.
  reubenyap:
    name: Reuben Yap
    title: Cofundador
    bio: Reuben Yap ha dirigido la estrategia general, los objetivos de desarrollo y los esfuerzos de investigación del proyecto durante los últimos años. Ahora sigue formando parte del equipo principal y gestiona sus equipos de desarrollo e investigación. Se unió al equipo poco después de su creación y ha desempeñado un papel clave para llevar a Firo a donde está hoy. Reuben, firme defensor de la privacidad en línea y financiera, fundó uno de los primeros servicios de VPN del sudeste asiático para combatir la censura en su país y es un ponente muy respetado en la materia, con entrevistas y comentarios en BBC, Nasdaq Tradetalks, Forbes, Coindesk, Reuters y Cheddar News, entre otros. Antes de unirse a Firo, Reuben era socio de un bufete de abogados, con más de diez años de ejercicio profesional especializado en asesoramiento sobre marcos jurídicos e institucionales.
  petershugalev:
    name: Peter Shugalev
    title: Desarrollador principal
    bio: Peter es un programador y arquitecto de software de gran talento con más de 20 años de experiencia. Vive en Moscú (Rusia) y se graduó magna cum laude en la Universidad Estatal de Moscú con un máster en Informática y Matemáticas. Ha creado servicios de red y de seguridad, e incluso su propio lenguaje de programación y un compilador multiplataforma para un sistema de detección de intrusiones basado en firmas. Su poco común combinación de conocimientos criptográficos y de programación ha ayudado a Firo a mantenerse a la vanguardia de la privacidad en cadena.
  levonpetrosyan:
    name: Levon Petrosyan
    title: Desarrollador
    bio: Levon es ingeniero de software con sendos másteres en Ciencias de la Computación y en Economía por la Universidad Americana de Armenia. Su formación se centra en la programación en C++ y la criptografía. Es uno de los colaboradores más prolíficos de Firo, ya que ha programado gran parte de la biblioteca criptográfica Lelantus de Firo, además de optimizaciones para admitir grandes conjuntos de anonimato.
  sproxet:
    name: Sproxet
    title: Desarrollador
    bio: Sproxet es un desarrollador anónimo que lleva 15 años trabajando en software que preserva la privacidad y ha contribuido de forma importante al cliente Electron de Firo. Sproxet también es el fundador de Signal Eleven, una consultora de TI centrada en la seguridad y la auditoría informáticas, el desarrollo de software y el diseño de arquitecturas de sistemas criptográficos.
  zorayrzakaryan:
    name: Zorayr Zakaryan
    title: Jefe de proyecto móvil
    bio: Zorayr es desarrollador de software backend con más de 14 años de experiencia. Está especializado en dirigir equipos de ingeniería y en establecer procesos de desarrollo adecuados. Le encanta todo lo relacionado con los algoritmos, las criptomonedas y los videojuegos.
  hakobkanoyan:
    name: Hakob Kanoyan
    title: Desarrollador móvil
    bio: Hakob tiene más de 10 años de experiencia como desarrollador móvil, de backend y de videojuegos. Tiene una sólida formación matemática, incluida la criptografía. Hakob dirige el desarrollo técnico del monedero móvil de Firo.
  haykzakaryan:
    name: Hayk Zakaryan
    title: Desarrollador móvil
    bio: Con más de 11 años de experiencia en ingeniería de software, incluidos más de 7 años de desarrollo móvil nativo y multiplataforma, Hayk se unió al equipo de Firo como ingeniero móvil a tiempo parcial.
  arminezakaryan:
    name: Armine Zakaryan
    title: Diseñadora UI/UX
    bio: Diseñadora UX/UI con más de 5 años de experiencia. Es una diseñadora autodidacta llena de entusiasmo y motivación por crear experiencias innovadoras y fáciles de usar e interfaces de usuario creativas. Actualmente trabaja sobre todo en diseños de productos SaaS B2B.
  anwarp:
    name: Anwar P.
    title: Soporte sénior
    bio: Anwar estudió ingeniería eléctrica y electrónica y tiene varios años de experiencia en soporte técnico en una empresa de TI. Se encarga de las consultas de soporte, la documentación y el soporte a desarrolladores, y también ayuda al Project Steward en el día a día.
  ajaydono:
    name: Ajaydono
    title: Soporte
    bio: Ajay ayuda al Project Steward en las operaciones diarias y en las consultas de soporte. Tiene un diploma en Tecnologías de la Información con especialización en administración de bases de datos y varios años de experiencia en soporte técnico de TI.
  lucasfullam:
    name: Lucas Fullam
    title: Responsable de comunidad
    bio: Lucas Fullam ha trabajado en puestos de cara al cliente, desde representante de atención al cliente hasta montaje de eventos en recintos y congresos. Oyó hablar de las criptomonedas por primera vez en 2012, pero no se adentró de verdad en ellas hasta bien entrado 2017, cuando un amigo le introdujo más a fondo en el mundo cripto y por fin vio todo su potencial. Una cosa llevó a la otra, al final encontró Firo y el resto es historia.
  sebastianbausch:
    name: Sebastian Bausch
    title: Operaciones en Asia
    bio: Sebastian Bausch es un inversor ángel afincado en Bangkok al que le apasionan las criptomonedas desde 2011. Estudió mandarín en la Universidad de Xiamen y tiene un título de posgrado de la Universidad de Nottingham. Apoya las operaciones del equipo en la región y coordina traducciones y encuentros.
  lemarlukebriones:
    name: Lemar "Luke" Briones
    title: Responsable de la comunidad filipina
    bio: Graduado en Tecnologías de la Información en Filipinas, Lemar es un entusiasta de las criptomonedas desde 2017 y se dedica a dar a conocer Firo por todo el país.
  aramjivanyan:
    name: Aram Jivanyan
    title: Arquitecto jefe de privacidad
    bio: Aram ha sido una figura clave en el desarrollo de la tecnología central de Firo, ya que ha creado los protocolos Lelantus y Lelantus Spark. Estas innovaciones científicas han influido notablemente en el panorama de los protocolos de privacidad del mundo de las criptomonedas y han inspirado la creación de otros protocolos centrados en la privacidad, como Triptych (Monero), Seraphis (Monero) y Lelantus-MW (Beam). También ha diseñado sistemas de votación que preservan la privacidad con requisitos mínimos de confianza, como Aura.
  aregvrtanesyan:
    name: Areg Vrtanesyan
    title: Investigador y desarrollador de criptografía
    bio: Areg es ingeniero criptográfico en Firo y actualmente estudia Ciberseguridad en la YSU. Tiene experiencia en ingeniería de software y programación backend en C++. Sus intereses actuales son la criptografía, la seguridad de la información y la música.
  tigranmamikonyan:
    name: Tigran Mamikonyan
    title: Investigación
    bio: Tigran tiene un máster en Informática y Matemática Aplicada y en Ciencias de la Computación y la Información. Actualmente cursa el doctorado en Informática y Matemática Aplicada en la Universidad Estatal de Ereván.
  artur:
    name: Artur
    title: Desarrollador
    bio: Artur es un prometedor ingeniero de software y estudiante de la Universidad Estatal de Medicina de Ereván que aporta una combinación única de conocimientos médicos y habilidades tecnológicas. Graduado en Picsart Academy, destaca en C/C++ y tiene experiencia práctica en desarrollo de software. Su pasión es unir medicina y tecnología para crear soluciones con impacto.
  narek:
    name: Narek Geghamyan
    title: Desarrollador
    bio: Narek es ingeniero de software graduado en la Facultad de Informática de la Universidad Nacional de Arquitectura y Construcción de Armenia. Trabaja con C++ y Linux. Le apasionan la natación y la programación.
  cypherstack:
    name: Cypher Stack
    title: Empresa de diseño
    bio: Cypher Stack es una empresa de desarrollo blockchain, diseño, investigación y consultoría. Actualmente desarrolla para Firo su monedero móvil y su monedero ligero de escritorio, Campfire.
  batuhan:
    name: Batuhan
    title: Responsable de la comunidad turca
    bio: Batuhan gestiona la comunidad turca y traduce anuncios y avisos
  antibit:
    name: Antibit
    title: Responsable de la comunidad rusohablante
    bio: Antibit gestiona la comunidad rusohablante y traduce anuncios y avisos. Es un entusiasta de las criptomonedas desde 2012 y en este tiempo ha acumulado muchos conocimientos y experiencia sobre las criptomonedas y las tecnologías blockchain.
  lilking:
    name: Lil-King
    title: Responsable de comunidad
    bio: Lil-King es un defensor entregado de la privacidad en el mundo cripto con más de cinco años de experiencia. Especializado en marketing e incorporación de usuarios, Lil-King ha desempeñado un papel crucial en la promoción de proyectos centrados en la privacidad. Apasionado de la privacidad financiera, Lil-King se dedica a formar a los usuarios y a darles las herramientas para controlar sus activos digitales de forma segura.
  navidrahimi:
    name: Navid Rahimi
    title: Desarrollador
    bio: Navid tiene una sólida formación en infraestructura de compiladores y optimización de sistemas de bajo nivel. Tiene un máster en Ciencias de la Computación por la Universidad Simon Fraser y trabajó como ingeniero de compiladores en Microsoft. Actualmente es desarrollador del núcleo blockchain de Firo, donde trabaja en funciones a nivel de protocolo como Lelantus Spark, la optimización del rendimiento de los nodos, la verificación del consenso y mejoras en las capas P2P y RPC para reforzar la estabilidad y la seguridad de la red.
  
roadmap:
  heading: Hoja de ruta
  intro1: Firo ha recorrido un largo camino desde sus inicios como Zcoin, cuando fue pionero en el uso de pruebas de conocimiento cero modernas en un protocolo de privacidad. Con el tiempo, hemos ido mejorando nuestra tecnología de forma constante y hemos desarrollado algunos de los protocolos de privacidad más sólidos del sector, protocolos que han influido en muchos otros proyectos.
  intro2: Nuestra hoja de ruta actualizada se centra en la usabilidad, la utilidad y las mejoras.
  usability: Usabilidad
  usabilityp: Mejorar la experiencia de usuario, integrarse con más monederos y dar soporte a clientes ligeros.
  utility: Utilidad
  utilityp: Ampliar los casos de uso mediante la emisión privada de tokens y aplicar nuevas mejoras de privacidad como preparación para los futuros retos de la computación cuántica.
  upgrades: Mejoras
  upgradesp: Reforzar continuamente las funciones básicas del protocolo para mantener la posición de Firo como líder en tecnología de privacidad.
  neartermgoals: Objetivos a corto plazo
  sparknames: Spark Names
  sparknamesp: Permitir a los usuarios registrar direcciones legibles vinculadas a sus direcciones Spark. También permite almacenar y compartir metadatos para un posible uso como identidad digital descentralizada.
  sparkcoinbase: Spark Coinbase
  sparkcoinbasep: Permitir que mineros y masternodes envíen las recompensas directamente a direcciones Spark privadas, lo que mejora aún más la privacidad de los usuarios y la adopción de Spark.
  viewkeytooling: Herramientas para claves de visualización
  viewkeytoolingp: Desarrollar métodos fáciles de usar para compartir y utilizar las claves de visualización de Spark, lo que permite monederos de solo lectura y revelar de forma selectiva fondos basados en Spark a efectos de cumplimiento normativo.
  midtermgoals: Objetivos a medio plazo
  sparkassets: Spark Assets
  sparkassetsp: Permitir a los usuarios emitir sus propios activos que preservan la privacidad. Estos activos disfrutan de las mismas funciones de privacidad que Spark, incluida la posibilidad de ocultar el tipo de activo. Todos los activos (incluido Firo) contribuyen a un conjunto de anonimato compartido, y el protocolo también puede admitir NFT que preservan la privacidad.
  sparkswap: Spark Swap
  sparkswapp: Permitir intercambios atómicos entre activos Spark y/o Firo, para garantizar intercambios privados y sin necesidad de confianza.
  curvetrees: Curve Trees
  curvetreesp: Adoptar Curve Trees, una técnica innovadora para pruebas de pertenencia eficientes que admite un conjunto de anonimato global. Esta mejora optimizará considerablemente la privacidad, la escalabilidad, la velocidad de verificación y el tamaño de las pruebas.
  longtermgoals: Objetivos a largo plazo
  improvedinfra: Mejor infraestructura de monederos ligeros que preserva la privacidad
  improvedinfrap: Seguir investigando formas de reducir la dependencia de servidores SPV personalizados, para ofrecer a los usuarios opciones de monedero ligero más privadas y descentralizadas.
  quantum: Spark resistente a la computación cuántica
  quantump: Explorar vías para convertir Spark en un protocolo resistente a la computación cuántica, así como posibles medidas provisionales frente a futuras amenazas cuánticas.
  tailemission: Mecanismo de consenso para la emisión de cola
  tailemissionp: El modelo híbrido actual de Firo, que combina masternodes y prueba de trabajo, podría evolucionar cuando se alcance la emisión de cola. Estamos estudiando mecanismos de incentivos o de consenso alternativos para proteger la cadena a largo plazo.
  governance: Gobernanza
  governancep: Desarrollar estructuras de gobernanza claras y descentralizadas para reducir la dependencia del equipo principal de Firo. El objetivo es alinear a todas las partes interesadas del proyecto sin centrarse únicamente en la cantidad de monedas que poseen.
  integrations: Integraciones
  enkrypt: Integración con el monedero Enkrypt
  enkryptp: Integrar Firo en Enkrypt, un monedero Web3 multiactivo en forma de extensión del navegador, con soporte completo para las funciones de Spark.
  layerswap: Integración con Layerswap v8
  layerswapp: Aprovechar Layerswap v8, un protocolo entre pares para mover e intercambiar criptoactivos entre distintas blockchains. Al usar pre-HTLC, resuelve muchas de las limitaciones de los intercambios atómicos tradicionales (p. ej., que ambas partes tengan que estar conectadas) y admite transacciones con varios saltos.
  serai: Integración con Serai
  seraip: Colaborar con Serai, un DEX entre cadenas centrado en la liquidez AMM para Bitcoin, Ethereum, DAI y Monero. Integrar Firo amplía sus opciones de liquidez entre cadenas y su base de usuarios.
  iterative: Mejoras iterativas
  campfire: Campfire
  campfirep: Seguir desarrollando los monederos de escritorio y móviles Campfire para ofrecer soporte completo a masternodes, Spark Assets y Spark Names.
  firodex: FiroDEX
  firodexp: Rediseñar FiroDEX para hacerlo más resiliente, de modo que su infraestructura (tanto los nodos como las interfaces) la gestione una red descentralizada de voluntarios y miembros de la comunidad.

roadmap-old:
  aura: Votación privada Aura (finalizando el artículo)
  auradesc: Aura es nuestro mecanismo de votación privada para DAO, inspirado en nuestra tecnología Lelantus, que permite votar de forma anónima pero verificable y que además oculta el avance del escrutinio. Queremos usarlo como base para avanzar hacia una gobernanza descentralizada formalizada.
  avalanche: Avalanche
  avalanchedesc: Avalanche es un algoritmo de consenso que permite transacciones instantáneas, mayor seguridad y actualizaciones sin bifurcaciones. Estamos estudiando el consenso Avalanche como posible sustituto de nuestros masternodes.
  development: Desarrollo
  heading: Hoja de ruta
  mnodes: Masternodes deterministas (hecho)
  mnodesq: Quórums de masternodes de larga duración (hecho)
  mtpstrip: Eliminación de pruebas MTP (hecho)
  mtpstripdesc: La eliminación de pruebas MTP reduce el tamaño de la blockchain de Firo de 60 GB a 4 GB al quitar las pruebas MTP de los bloques antiguos.
  rebrand: Cambio de marca (hecho)
  lelantus: Activación de Lelantus (hecho)
  lelantusdesc: Lelantus es nuestro protocolo de privacidad de nueva generación, que ofrece los niveles más altos de privacidad práctica sin configuración de confianza y basándose solo en supuestos criptográficos sólidos. Lelantus admite conjuntos de anonimato varios órdenes de magnitud mayores que otros sistemas de privacidad sin configuración de confianza.
  chainlocks: Chainlocks (hecho)
  chainlocksdesc: Chainlocks utiliza la red de masternodes de Firo para proteger frente a ataques del 51 %. Las transacciones alcanzan la finalidad en cuanto se confirma 1 bloque.
  rap: Direcciones RAP (hecho)
  rapdesc: Las direcciones RAP permiten tener una dirección que se puede compartir públicamente sin que terceros puedan ver cuánto ni cuándo ha recibido fondos.
  instant: Instant Send (hecho)
  instantdesc: Instant Send utiliza la red de masternodes de Firo para que las transacciones se confirmen en pocos segundos, lo que permite usarlo en la práctica como medio de intercambio.
  elysium: Elysium (en testnet)
  elysiumdesc: Elysium permite emitir en la red de Firo tokens (por ejemplo, stablecoins o monedas respaldadas por activos) que se beneficiarán de la tecnología de privacidad de Firo.
  elysiumv2: Elysium v2
  elysiumv2desc: Elysium v2 amplía las capacidades de Elysium con puentes más sencillos y funciones DeFi. Elysium v2 también implementará Spats, que ocultará el tipo de activo transferido.
  lelantusspark: Lelantus Spark (hecho)
  lelantussparkdesc: Lelantus Spark permite pagos anónimos directos para que los usuarios realicen transacciones entre sí sin revelar importes, origen ni destinatario. Spark introduce las direcciones Spark, que permitirán a los usuarios mantener sus fondos totalmente ocultos, además de ofrecer soporte completo para claves de visualización y multifirma de umbral.
  mobile: Monedero móvil (hecho)
  mobiledesc: Un monedero móvil nativo y privado por defecto con soporte completo para transacciones Lelantus.
  firopow: FiroPoW (hecho)
  firopowdesc: FiroPoW es una variante de ProgPOW diseñada para GPU y con una gran resistencia a los ASIC.
  research: Investigación
  lelantussparkaddress: Subdirecciones y pruebas de pago de Lelantus Spark (hecho)
  lelantussparkaddressdesc: Lelantus Spark admitirá subdirecciones que permiten un escaneo más eficiente y pruebas de pago con las que los usuarios pueden demostrar que realizaron un pago.
  firodex: FiroDEX (hecho)
  firodexdesc: FiroDEX permite a los usuarios cambiar a Firo y desde Firo mediante una infraestructura descentralizada basada en la tecnología de intercambio atómico.
  bridges: Puentes entre cadenas
  bridgesdesc: Los puentes entre cadenas permitirán que tokens de otros ecosistemas entren y salgan de la capa de tokens Elysium de Firo para aprovechar nuestra infraestructura de privacidad.
  mixnets: Mixnets
  mixnetsdesc: Canalizar las transacciones y las comunicaciones entre nodos a través de mixnets ofrece una mayor protección de los metadatos, incluso frente a adversarios a nivel estatal. Estamos estudiando la mixnet Meson, construida sobre las bibliotecas de software de Katzenpost.
  spats: Spark Assets (hecho)
  spatsdesc: Spark Assets amplía la funcionalidad de Spark para ocultar el tipo de activo transferido. Está previsto implementar Spats en Elysium v2.
  syncclients: Clientes de sincronización rápida
  syncclientsdesc: Los clientes de sincronización rápida permiten a los usuarios sincronizar sus monederos rápidamente sin tener que descargar toda la blockchain, con soporte para transacciones Lelantus.
  learnmore: Más información
  
