home:
  heading: Encendiendo la chispa <br class="brmob">de la revolución de la privacidad
  heading2: Dinero privado para todos. <br>Sin vigilancia. Sin rastros. Sin concesiones.
  happening: Lo que está pasando ahora.
  case: Usado en el mundo real. Ahora mismo.
  case1: En 2018, el Partido Demócrata de Tailandia usó Firo para celebrar sus primarias, la primera vez que un gran partido político realizaba una votación a gran escala en una blockchain pública. Más de 127.000 personas votaron con total privacidad y con un resultado verificable.
  case2: "En Siria, los miembros de la comunidad no esperan a que llegue un sistema mejor: lo están construyendo. Ya se está poniendo en marcha una oficina local de formación sobre Firo para ofrecer a la gente una forma práctica de guardar y transferir valor de forma privada, al margen de un sistema bancario que les raciona su propio dinero. Así es la adopción de Firo sobre el terreno."
  case3: En la Monero Conference de 2025 en Praga, investigadores y desarrolladores de privacidad de proyectos rivales destacaron a Firo como uno de los pocos proyectos con una integridad técnica genuina. Un reconocimiento así, por encima de las fronteras entre comunidades, no se concede a la ligera.
  cta1: Consigue Firo
  cta2: Descarga el monedero
  campfire: "Consigue Campfire"
  campfiretext: "Firo en tu móvil"
  firomsg: "Tu dinero no debería ser un dispositivo de rastreo"
  firomsgp: "Firo te permite enviar y recibir dinero de forma privada. Tu saldo, tu historial, a quién pagas: oculto por defecto y visible solo para quien tú elijas"
  pillar1: "Privado"
  pillar1text1: "Tecnología Lelantus Spark de vanguardia"
  pillar1text2: "Saldos y transacciones privados"
  pillar1text3: "Un sólido conjunto de anonimato"
  pillar1link: "Más información"
  pillar2: "Práctico"
  pillar2text1: "Spark Names"
  pillar2text2: "Direcciones Spark"
  pillar2text3: "InstantSend"
  pillar2text4: "Campfire"
  pillar2link: "Explora"
  pillar3: "Ecosistema"
  pillar3text1: "Spark Assets"
  pillar3text2: "FiroDEX"
  pillar3text3: "RosenBridge"
  pillar3link: "Descubre más"
  quote2: "«La privacidad es necesaria para una sociedad abierta en la era electrónica»."
  quote2a: "- UN MANIFIESTO CYPHERPUNK · 1993"
  problem_heading: El dinero ya es una herramienta de vigilancia.
  problem1: "La mayoría de las monedas digitales registran para siempre todo tu historial financiero. Tu saldo, tus hábitos, cada persona a la que has pagado. Cualquiera con las herramientas adecuadas puede verlo todo. No es un fallo: es así por diseño."
  problem2: Tu banco sabe más de tu vida que la mayoría de la gente. Cada compra queda registrada y se vende. Nunca te pidieron permiso. A medida que desaparece el efectivo, desaparece también la última forma de gastar de manera verdaderamente privada.
  problem3: No es teoría. En Siria, las retiradas bancarias semanales están limitadas a unos 38 dólares. Un miembro de la comunidad ya está montando una oficina física para enseñar a la gente a usar Firo como alternativa práctica.
  problem4: "La privacidad no consiste en esconderse. Consiste en el consentimiento: el derecho a elegir quién ve en qué gastas. Ese derecho venía con el efectivo. Firo lo recupera."
  privacy: Privacidad
  privacy1: Firo desarrolló Lelantus Spark, que ofrece privacidad en cadena y sin necesidad de confianza con grandes conjuntos de anonimato. La tecnología Dandelion++ aporta privacidad en la capa de red.
  privacy2: conjunto de anonimato
  privacy3: sin configuración de confianza
  apart: La tecnología de privacidad sobre la que construyen otros.
  apart1: La mayoría de los proyectos de privacidad adoptan tecnología existente y le cambian el nombre. Firo construye desde cero. Los sistemas de privacidad que hemos diseñado han sido adoptados por otros grandes proyectos del sector. Cuando la industria necesitó un modelo mejor, se fijó en lo que había construido Firo.
  apart2: Llevamos haciendo esto desde 2016. Nuestro trabajo ha sido auditado de forma independiente, revisado por pares y publicado. No somos nuevos en esto.
  pointproof1: 9 años de desarrollo continuo.
  pointproof2: Investigación original. Ni bifurcaciones ni copias.
  pointproof3: Auditado de forma independiente por empresas de seguridad externas.
  pointproof4: Citado y adoptado por otros grandes proyectos de privacidad.
  blockchain: Blockchain
  blockchain1: Nuestro sistema híbrido de PoW y Chainlocks LLMQ protege frente a ataques del 51 % y garantiza una finalidad casi instantánea de bloques y transacciones, lo que convierte a Firo en una opción ideal para pagos seguros y eficientes.
  blockchain2: suministro total + emisión de cola
  blockchain3: prueba de trabajo
  blockchain4: masternodes
  privacyin: Infraestructura de privacidad
  privacyin1: Con Spark Assets, Firo extiende la privacidad más allá de las transacciones, hasta los propios activos. Esta función oculta el tipo de activo que se transfiere, lo que la hace perfecta para crear tokens centrados en la privacidad que pueden usarse en aplicaciones seguras y anónimas, como votaciones o activos tokenizados privados.
  randd: Investigación y desarrollo
  randd1: Firo destaca como uno de los pocos proyectos que aportan investigación independiente a tecnologías de privacidad y descentralización en blockchain como Zerocoin, Sigma, Lelantus, Lelantus Spark y MTP. Nuestro trabajo ha desempeñado un papel clave en el sector, ya que ha influido en otros proyectos o ha sido adoptado por ellos.
  sparkassets: Privacidad para cualquier activo, no solo para Firo
  sparkassets1: "La privacidad de Firo no se limita a su propia moneda. Spark Assets permite que cualquier token herede las mismas protecciones: stablecoins, puntos de fidelidad, credenciales de voto, NFT. Una vez dentro de la red de Firo, los activos se vuelven indistinguibles entre sí. Infraestructura privada para todo lo que mueve valor."
  solution: Privacidad que no te pide confiar en nadie
  solution1: "Cuando envías Firo, el importe, el remitente y el destinatario quedan ocultos. Ni difuminados ni opcionales: ocultos. Sin necesidad de configurar nada. La privacidad es su forma de funcionar."
  solution2: La mayoría de las transacciones pueden rastrearse hasta el dispositivo que las envió. Firo está diseñado para que ni siquiera tu conexión a internet revele nada. Anónimo desde el principio.
  solution3: Las transacciones de Firo se confirman en segundos y no pueden revertirse ni manipularse. Miles de nodos independientes mantienen la red honesta. No hay ninguna entidad central a la que presionar, hackear o cerrar.
  community: Financiado por la comunidad. Gobernado por la comunidad.
  community1: "El desarrollo de Firo se financia a través de un Fondo Comunitario descentralizado: ni una tesorería corporativa ni capital riesgo. Cualquiera puede proponer ideas, y la comunidad vota qué se construye. No es teatro de gobernanza. Es como funciona Firo de verdad."
  getfiro: Consigue Firo
  getfiro1: Compra, mina o gana Firo, y únete a la revolución de la privacidad. <br>Guarda tus Firo en uno de nuestros monederos repletos de funciones, optimizados para ofrecer potencia, accesibilidad y una buena experiencia de usuario.
  getfiro2: Consigue un monedero
  getfiro2text: Firo ofrece varias opciones para gestionar tus fondos en los principales sistemas operativos de escritorio y móviles. Elige la que mejor te funcione.
  getfiro2link: Descarga un monedero
  getfiro3: Compra Firo
  getfiro3text: Firo ofrece varias opciones para gestionar tus fondos en los principales sistemas operativos de escritorio y móviles. Elige la que mejor te funcione.
  getfiro3link: Encuentra un exchange
  getfiro4: Gana Firo
  getfiro4text: Puedes configurar tu propio masternode de Firo para ganar Firo. Te guiamos paso a paso en el proceso de configuración en nuestra guía detallada.
  getfiro4link: Configura un masternode
  getfiro5: Empieza a minar
  getfiro5text: FiroPoW, el algoritmo de minería de Firo, está diseñado para minarse con GPU. Sigue nuestra guía para empezar a minar tus primeros Firo.
  getfiro5link: Lee la guía de minería
  getcampfirelink: Descárgalo ahora
  manifesto: "La privacidad es necesaria para una sociedad abierta en la era electrónica."

