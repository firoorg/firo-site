private:
  heading: "Tu dinero no es asunto de nadie"
  lead: "La mayoría de las criptomonedas exponen tu saldo y tu historial de pagos en un registro público. En los monederos oficiales de Firo, Spark hace que los pagos privados sean la opción predeterminada."
  cta: "Consigue un monedero privado"
  sparktitle: "Lelantus Spark"
  sparktext: "El protocolo de privacidad de Firo para pagos directos. Spark oculta el remitente, el destinatario y el importe a quienes observan el registro público, mientras que las pruebas de conocimiento cero permiten a la red verificar cada transacción sin necesidad de una configuración de confianza."
  sparklink: "Lee la investigación"
  balancestitle: "Saldos y pagos privados"
  balancestext: "Las direcciones Spark no pueden buscarse en la blockchain como las direcciones públicas normales. Los fondos que guardas y los pagos que haces con Spark quedan fuera de la vista pública, mientras que las claves de visualización te permiten compartir información de tus transacciones cuando tú decidas."
  anonsettitle: "Conjuntos de anonimato grandes y solapados"
  anonsettext: "Cada gasto de Spark se oculta entre un gran conjunto de monedas posibles. Estos conjuntos se organizan como ventanas solapadas, de modo que cada nuevo conjunto arrastra la privacidad del anterior en lugar de empezar con una multitud vacía. Cuanta más actividad haya en Spark, mayor será la multitud en la que esconderse."
  opentitle: "Privacidad diseñada para entenderse y para durar."
  opentext: "El dinero privado no debería depender de una sola empresa ni de un pequeño círculo de expertos. Spark combina componentes criptográficos consolidados, investigación publicada, código abierto y un diseño modular para que el escrutinio independiente y el mantenimiento a largo plazo sean viables."
  comparetitle: "Decisiones de diseño que puedes comprobar"
  comparelead: "Una privacidad que no puedes inspeccionar es una privacidad en la que tienes que confiar a ciegas. Así está construido Spark y esto es lo que permite cada decisión."
  tablecol1: "Decisión de diseño"
