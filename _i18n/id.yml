tech:
  heading: Riset
  heading1: Privasi adalah tentang selangkah lebih maju. Tim di balik Firo bertanggung jawab atas beberapa protokol privasi blockchain paling signifikan yang tercatat, dan semua teknologi itu dirangkum dalam Firo.
  academicpapers: Makalah Akademik
  audits: Audit
  sparklelantus1: Teknologi Lelantus Spark
  sparklelantus2: Lelantus Spark sangat meningkatkan pendahulunya Lelantus dengan alamat Spark yang fleksibel yang menyembunyikan semua jumlah transaksi, tidak dapat dicari di blockchain sekaligus memungkinkan tanda tangan ambang yang efisien serta dukungan kunci lihat masuk dan keluar. Spark juga memiliki struktur modular yang memungkinkan komponen ditingkatkan saat teknologi yang lebih baik muncul sekaligus menyederhanakan analisis keamanan. Ia mempertahankan manfaat Lelantus tanpa setup terpercaya, dengan konstruksi yang mudah dipahami dan berdasarkan asumsi kriptografi yang mapan.
  lelantus1: Teknologi Lelantus
  lelantus2: Lelantus adalah protokol privasi generasi berikutnya yang dikembangkan oleh Aram Jivanyan di Firo. Lelantus memungkinkan Anda membakar koin Anda, yang menyembunyikannya dalam set anonimitas lebih dari 65.000. Penerima dapat menebusnya dari kumpulan anonimitas ini, yang memutus tautan dari transaksi Anda dan semua transaksi sebelumnya yang telah dilaluinya.
  sigma1: Teknologi Sigma
  sigma2: Kami percaya seluruh tujuan blockchain adalah membangun sistem yang tidak memerlukan kepercayaan, dan prinsip yang sama berlaku untuk sistem privasi kami. Inilah mengapa kami membangun Sigma untuk Zcoin pada 2018 yang menghilangkan kebutuhan setup terpercaya di Zerocoin. Sigma menggunakan kurva ECC 256-bit untuk ukuran bukti hanya 1,5 kB - peningkatan 17x dari teknologi saat itu. Sigma adalah pendahulu Lelantus, dan menjadi batu loncatan penting menuju posisi kami saat ini.
  dandelion1: Teknologi Dandelion
  dandelion2: Dandelion++ melindungi alamat IP Anda. Sebelum transaksi Firo disiarkan ke seluruh jaringan, transaksi tersebut diacak antar node secara acak beberapa langkah. Dengan cara ini, asal siaran tidak dapat dikaitkan dengan alamat IP Anda.
  mtp1: Keamanan yang terdesentralisasi dan adil
  mtp2: Algoritma penambangan Merkle Tree Proof (MTP) Firo dirancang untuk mendemokratisasi penambangan. Algoritma MTP intensif memori sehingga meningkatkan biaya pembuatan ASIC dan menjaga rantai tetap dapat ditambang dengan perangkat keras umum seperti GPU. Namun, node dapat melewati kebutuhan memori ini dan memverifikasi bukti secara efisien. Audit yang disponsori Firo pada 2017 membuktikan efektivitas pendekatan dua sisi ini. MTP sejak itu telah digantikan oleh FiroPoW yang memiliki bukti lebih kecil dan strategi tambahan tahan ASIC.

team:
  heading: Tim
  founders: pendiri
  coreteam: pengembang inti
  mobileteam: pengembangan seluler
  research: riset
  community: komunitas
  poramininsom:
    name: Poramin Insom
    title: Salah Satu Pendiri
    bio: Poramin Insom mendirikan Zcoin (sekarang Firo) pada 2016, berupaya menyediakan privasi finansial dan juga penambangan yang lebih inklusif melalui proof of work tahan ASIC. Ia meraih gelar master di bidang Keamanan Informasi dari Johns Hopkins University di mana ia menulis makalah tentang implementasi praktis yang diusulkan dari protokol Zerocoin. Ia meletakkan fondasi teknologi Zcoin (sekarang Firo) mulai dari mengkodekan implementasi Zerocoin pertama di dunia dan juga mendorong riset dan pengembangan algoritma penambangan MTP. Poramin telah fokus mendorong adopsi Firo di dunia nyata terutama dalam keterlibatannya memfasilitasi Partai Demokrat Thailand untuk melakukan pemilihan primer untuk memilih pemimpin partainya di blockchain Firo pada 2018 yang merupakan pemilihan politik skala besar pertama di dunia di blockchain. Ia juga pernah bertugas di militer Thailand di mana ia bertanggung jawab atas perang siber.
  reubenyap:
    name: Reuben Yap
    title: Salah Satu Pendiri
    bio: Reuben Yap telah memimpin proyek dalam strategi keseluruhan, tujuan pengembangan, dan upaya riset selama beberapa tahun terakhir. Ia kini tetap menjadi bagian dari tim inti yang mengelola tim pengembangan dan riset tim inti. Bergabung dengan tim tak lama setelah didirikan, ia memainkan peran penting dalam membentuk Firo hingga seperti sekarang. Reuben telah menjadi advokat vokal untuk privasi online dan finansial setelah mendirikan salah satu layanan VPN paling awal di Asia Tenggara untuk melawan sensor di negaranya dan merupakan pembicara yang dihormati tentang topik tersebut, dengan wawancara dan komentar unggulan di BBC, Nasdaq Tradetalks, Forbes, Coindesk, Reuters, dan Cheddar News, antara lain. Sebelum bergabung dengan Firo, Reuben adalah mitra di sebuah firma hukum dengan pengalaman praktik lebih dari sepuluh tahun yang berspesialisasi dalam pekerjaan advisory dalam kerangka hukum dan institusional.
  petershugalev:
    name: Peter Shugalev
    title: Pengembang Utama
    bio: Peter adalah programmer yang sangat terampil dan arsitek perangkat lunak dengan pengalaman lebih dari 20 tahun. Ia tinggal di Moskow, Rusia, dan lulus dari Universitas Negeri Moskow dengan predikat magna cum laude dengan gelar Master di bidang Ilmu Komputer dan Matematika. Ia telah menciptakan layanan terkait jaringan dan keamanan, dan bahkan menciptakan bahasa pemrogramannya sendiri serta kompiler lintas platform untuk sistem deteksi intrusi berbasis tanda tangan. Kombinasi langka antara pengetahuan kriptografi dan pemrogramannya telah membantu Firo tetap berada di garis depan privasi on-chain.
  levonpetrosyan:
    name: Levon Petrosyan
    title: Pengembang
    bio: Levon adalah insinyur perangkat lunak dengan gelar Master di bidang Ilmu Komputasi dan Ekonomi dari American University of Armenia. Latar belakangnya adalah pemrograman C++ dan kriptografi. Ia adalah salah satu kontributor Firo yang paling produktif setelah mengkodekan sebagian besar pustaka kriptografi Lelantus Firo bersama dengan optimalisasi untuk mendukung set anonimitas besar.
  sproxet:
    name: Sproxet
    title: Pengembang
    bio: Sproxet adalah pengembang anonim yang telah mengerjakan perangkat lunak yang menjaga privasi selama 15 tahun terakhir dan telah berkontribusi secara signifikan pada klien Electron Firo. Sproxet juga merupakan pendiri Signal Eleven, sebuah konsultan TI yang berfokus pada keamanan komputer dan audit, pengembangan perangkat lunak, dan desain arsitektur sistem kriptografi.
  zorayrzakaryan:
    name: Zorayr Zakaryan
    title: Manajer Proyek Seluler
    bio: Zorayr adalah pengembang backend perangkat lunak dengan pengalaman lebih dari 14 tahun. Spesialisasi dalam mengelola tim teknik dan membangun proses pengembangan yang tepat. Menyukai segala hal yang berkaitan dengan algoritma, mata uang kripto, dan video game.
  hakobkanoyan:
    name: Hakob Kanoyan
    title: Pengembang Seluler
    bio: Hakob memiliki pengalaman lebih dari 10 tahun sebagai pengembang seluler, backend, dan game. Ia memiliki latar belakang matematika yang kuat termasuk kriptografi. Hakob memimpin pengembangan teknis dompet seluler Firo.
  haykzakaryan:
    name: Hayk Zakaryan
    title: Pengembang Seluler
    bio: Dengan pengalaman lebih dari 11 tahun di rekayasa perangkat lunak, termasuk 7+ tahun pengembangan seluler native dan lintas platform, Hayk bergabung dengan tim Firo sebagai insinyur seluler paruh waktu.
  arminezakaryan:
    name: Armine Zakaryan
    title: Desainer UI/UX
    bio: Seorang desainer UX/UI dengan pengalaman lebih dari 5 tahun. Ia adalah desainer otodidak yang penuh antusiasme dan motivasi untuk menciptakan pengalaman inovatif yang ramah pengguna dan antarmuka pengguna yang kreatif. Saat ini mengerjakan sebagian besar desain produk SAAS B2B.
  anwarp:
    name: Anwar P.
    title: Dukungan Senior
    bio: Anwar mengambil jurusan teknik elektro dan elektronika, dengan pengalaman beberapa tahun dalam dukungan teknis di perusahaan TI. Ia menangani pertanyaan dukungan, dokumentasi, dukungan pengembang dan juga membantu Project Steward dalam urusan sehari-hari.
  ajaydono:
    name: Ajaydono
    title: Dukungan
    bio: Ajay membantu Project Steward dalam operasi sehari-hari serta pertanyaan dukungan. Ia memiliki Diploma di bidang Teknologi Informasi dengan spesialisasi Administrasi Database dan memiliki pengalaman beberapa tahun dalam dukungan teknis TI.
  lucasfullam:
    name: Lucas Fullam
    title: Manajer Komunitas
    bio: Lucas Fullam memiliki riwayat bekerja di pekerjaan yang berfokus pada pelanggan di masa lalu mulai dari perwakilan layanan pelanggan hingga penyiapan acara di tempat dan konferensi. Ia pertama kali mendengar tentang mata uang kripto pada 2012, tetapi tidak benar-benar mendalaminya sampai 2017 ketika salah satu temannya membawanya lebih dalam ke dunia kripto di mana ia akhirnya melihat betapa besar potensinya. Satu hal mengarah ke hal lain dan akhirnya ia menemukan Firo dan sisanya adalah sejarah.
  sebastianbausch:
    name: Sebastian Bausch
    title: Operasi Asia
    bio: Sebastian Bausch adalah investor malaikat yang berbasis di Bangkok dan telah bersemangat tentang mata uang kripto sejak 2011. Ia belajar bahasa Mandarin di Universitas Xiamen dan memegang gelar pascasarjana dari University of Nottingham. Ia mendukung operasi tim di kawasan ini dan mengoordinasikan terjemahan serta pertemuan.
  lemarlukebriones:
    name: Lemar "Luke" Briones
    title: Manajer Komunitas Filipina
    bio: Lulusan Teknologi Informasi dari Filipina, Lemar telah menjadi penggemar mata uang kripto sejak 2017 dan berdedikasi untuk menyebarkan kesadaran tentang Firo di seluruh Filipina.
  aramjivanyan:
    name: Aram Jivanyan
    title: Arsitek Privasi Utama
    bio: Aram telah menjadi tokoh kunci dalam mengembangkan teknologi inti Firo, setelah menciptakan protokol Lelantus dan Lelantus Spark. Inovasi ilmiah ini telah secara signifikan memengaruhi lanskap protokol privasi dalam ruang mata uang kripto, menginspirasi penciptaan protokol berfokus privasi lainnya seperti Triptych (Monero), Seraphis (Monero), dan Lelantus-MW (Beam). Ia juga merancang sistem voting yang menjaga privasi dengan kebutuhan kepercayaan minimal seperti Aura.
  aregvrtanesyan:
    name: Areg Vrtanesyan
    title: Peneliti Kriptografi / Pengembang
    bio: Areg adalah insinyur kriptografi di Firo dan saat ini mengambil jurusan Keamanan Siber di YSU. Memiliki pengalaman dalam rekayasa perangkat lunak dan pemrograman backend di C++. Minatnya saat ini adalah kriptografi, keamanan informasi, dan musik.
  tigranmamikonyan:
    name: Tigran Mamikonyan
    title: Riset
    bio: Tigran memegang gelar Master di bidang Informatika dan Matematika Terapan serta Ilmu Komputer dan Informasi. Ia saat ini sedang menempuh PhD di bidang Informatika dan Matematika Terapan di Yerevan State University.
  artur:
    name: Artur
    title: Pengembang
    bio: Artur adalah insinyur perangkat lunak yang sedang berkembang dan mahasiswa Yerevan State Medical University, membawa perpaduan unik antara pengetahuan medis dan keterampilan teknologi. Lulusan Picsart Academy, ia unggul dalam C/C++ dan memiliki pengalaman langsung dalam pengembangan perangkat lunak. Gairahnya terletak pada menggabungkan kedokteran dan teknologi untuk menciptakan solusi yang berdampak.
  narek:
    name: Narek Geghamyan
    title: Pengembang
    bio: Narek adalah insinyur perangkat lunak yang lulus dari Fakultas ilmu komputer di National University of Architecture and Construction of Armenia. Tumpukan teknologinya mencakup C++ dan Linux. Ia memiliki hasrat untuk berenang dan coding.
  cypherstack:
    name: Cypher Stack
    title: Firma Desain
    bio: Cypher Stack adalah perusahaan pengembang blockchain, desain, riset, dan konsultasi. Mereka saat ini mengembangkan Firo dengan dompet seluler dan dompet desktop ringan mereka, Campfire.
  batuhan:
    name: Batuhan
    title: Manajer Komunitas Turki
    bio: Batuhan mengelola komunitas Turki, menerjemahkan pengumuman dan pemberitahuan
  antibit:
    name: Antibit
    title: Manajer Komunitas Rusia
    bio: Antibit mengelola komunitas Rusia, menerjemahkan pengumuman dan pemberitahuan. Ia telah menjadi penggemar kripto sejak 2012, dan selama ini telah mengumpulkan banyak pengetahuan dan pengalaman mengenai mata uang kripto dan teknologi blockchain.
  lilking:
    name: Lil-King
    title: Manajer Komunitas
    bio: Lil-King adalah advokat privasi yang berdedikasi di ruang kripto dengan pengalaman lebih dari lima tahun. Mengkhususkan diri dalam pemasaran dan onboarding, Lil-King telah memainkan peran penting dalam mempromosikan proyek yang berfokus pada privasi. Bersemangat tentang privasi finansial, Lil-King berkomitmen untuk mendidik dan memberdayakan pengguna untuk mengendalikan aset digital mereka dengan aman.
  navidrahimi:
    name: Navid Rahimi
    title: Pengembang
    bio: Navid memiliki latar belakang kuat dalam infrastruktur kompiler dan optimasi sistem tingkat rendah. Ia memegang MSc di bidang Ilmu Komputer dari Simon Fraser University dan sebelumnya bekerja sebagai Compiler Engineer di Microsoft. Saat ini menjadi Pengembang Blockchain Inti di Firo, di mana ia mengerjakan fitur tingkat protokol termasuk Lelantus Spark, optimasi kinerja node, verifikasi konsensus, dan peningkatan pada lapisan P2P dan RPC untuk memperkuat stabilitas dan keamanan jaringan.

roadmap:
  heading: Peta Jalan
  intro1: Firo telah menempuh perjalanan panjang sejak awalnya sebagai Zcoin, mempelopori penggunaan bukti zero-knowledge modern dalam protokol privasi. Seiring waktu, kami terus mengiterasi teknologi kami, mengembangkan beberapa protokol privasi paling kuat di bidang ini — protokol yang telah memengaruhi banyak proyek lain.
  intro2: Peta jalan kami yang diperbarui berfokus pada kegunaan, utilitas, dan peningkatan.
  usability: Kegunaan
  usabilityp: Meningkatkan pengalaman pengguna, berintegrasi dengan dompet tambahan, dan mendukung klien ringan.
  utility: Utilitas
  utilityp: Memperluas kasus penggunaan melalui penerbitan token privat dan menerapkan peningkatan privasi lebih lanjut sebagai persiapan menghadapi tantangan komputasi kuantum di masa depan.
  upgrades: Peningkatan
  upgradesp: Terus memperkuat fitur inti protokol untuk mempertahankan posisi Firo sebagai pemimpin dalam teknologi privasi.
  neartermgoals: Tujuan jangka pendek
  sparknames: Spark Names
  sparknamesp: Memungkinkan pengguna mendaftarkan alamat yang dapat dibaca manusia yang terikat dengan alamat Spark mereka. Ini juga memungkinkan penyimpanan dan berbagi metadata untuk potensi penggunaan sebagai identitas digital terdesentralisasi.
  sparkcoinbase: Spark Coinbase
  sparkcoinbasep: Memungkinkan penambang dan masternode mengirim hadiah langsung ke alamat Spark privat, semakin meningkatkan privasi pengguna dan adopsi Spark.
  viewkeytooling: Perkakas Kunci Lihat
  viewkeytoolingp: Mengembangkan metode yang ramah pengguna untuk berbagi dan memanfaatkan kunci lihat Spark, memungkinkan dompet hanya-tonton dan pengungkapan selektif dana berbasis Spark untuk tujuan kepatuhan.
  midtermgoals: Tujuan jangka menengah
  sparkassets: Spark Assets
  sparkassetsp: Memungkinkan pengguna menerbitkan aset mereka sendiri yang menjaga privasi. Aset ini menikmati fitur privasi yang sama dengan Spark, termasuk kemampuan menyembunyikan jenis aset. Semua aset (termasuk Firo) berkontribusi pada set anonimitas bersama, dan protokol juga dapat mendukung NFT yang menjaga privasi.
  sparkswap: Spark Swap
  sparkswapp: Memungkinkan atomic swap antara aset Spark dan/atau Firo, memastikan pertukaran yang tanpa kepercayaan dan privat.
  curvetrees: Curve Trees
  curvetreesp: Mengadopsi Curve Trees, teknik inovatif untuk bukti keanggotaan yang efisien yang mendukung set anonimitas global. Peningkatan ini akan secara substansial meningkatkan privasi, skalabilitas, kecepatan verifikasi, dan ukuran bukti.
  longtermgoals: Tujuan jangka panjang
  improvedinfra: Infrastruktur Dompet Ringan yang Menjaga Privasi yang Ditingkatkan
  improvedinfrap: Terus meneliti cara untuk mengurangi ketergantungan pada server SPV yang disesuaikan, memberikan pengguna opsi dompet ringan yang lebih privat dan terdesentralisasi.
  quantum: Spark Tahan Kuantum
  quantump: Menjelajahi jalur untuk mentransisikan Spark menjadi protokol tahan kuantum, serta mitigasi sementara potensial untuk melindungi dari ancaman kuantum di masa depan.
  tailemission: Mekanisme Konsensus Emisi Ekor
  tailemissionp: Model hybrid masternode–Proof-of-Work Firo saat ini dapat berkembang setelah emisi ekor tercapai. Kami sedang menyelidiki mekanisme insentif atau konsensus alternatif untuk mengamankan rantai dalam jangka panjang.
  governance: Tata Kelola
  governancep: Mengembangkan struktur tata kelola yang jelas dan terdesentralisasi untuk mengurangi ketergantungan pada tim inti Firo. Tujuannya adalah menyelaraskan semua pemangku kepentingan proyek tanpa hanya berfokus pada kepemilikan koin.
  integrations: Integrasi
  enkrypt: Integrasi Dompet Enkrypt
  enkryptp: Integrasikan Firo ke dalam Enkrypt, dompet ekstensi browser Web3 multi-aset, dengan dukungan penuh untuk fitur Spark.
  layerswap: Integrasi Layerswap v8
  layerswapp: Manfaatkan Layerswap v8, protokol peer-to-peer untuk menjembatani dan menukar aset kripto di berbagai blockchain. Dengan menggunakan pre-HTLC, ia mengatasi banyak keterbatasan atomic swap tradisional (misalnya, kedua pihak harus online) dan mendukung transaksi multi-hop.
  serai: Integrasi Serai
  seraip: Berkolaborasi dengan Serai, DEX lintas rantai yang berfokus pada likuiditas AMM untuk Bitcoin, Ethereum, DAI, dan Monero. Mengintegrasikan Firo memperluas opsi likuiditas lintas rantai dan basis penggunanya.
  iterative: Peningkatan Iteratif
  campfire: Campfire
  campfirep: Terus membangun dompet desktop dan seluler Campfire untuk menyediakan dukungan berfitur lengkap untuk masternode, Spark Assets, dan Spark Names.
  firodex: FiroDEX
  firodexp: Kerjakan ulang FiroDEX agar lebih tangguh, memastikan infrastrukturnya — baik node maupun front end — dioperasikan oleh jaringan relawan dan anggota komunitas yang terdesentralisasi.

roadmap-old:
  aura: Aura Private Voting (menyelesaikan makalah)
  auradesc: Aura adalah mekanisme voting privat kami untuk DAO yang terinspirasi oleh teknologi Lelantus kami yang memungkinkan voting anonim namun dapat diverifikasi yang juga menyembunyikan progres pemungutan suara. Kami bermaksud menggunakannya sebagai fondasi untuk bergerak menuju tata kelola terdesentralisasi yang diformalkan.
  avalanche: Avalanche
  avalanchedesc: Avalanche adalah algoritma konsensus yang memungkinkan transaksi instan, keamanan yang ditingkatkan, dan peningkatan tanpa fork. Kami sedang menjajaki konsensus Avalanche sebagai potensi pengganti masternode kami.
  development: Pengembangan
  heading: Peta Jalan
  mnodes: Masternode Deterministik (selesai)
  mnodesq: Kuorum Masternode Jangka Panjang (selesai)
  mtpstrip: MTP Strip (selesai)
  mtpstripdesc: MTP stripping mengurangi ukuran blockchain Firo dari 60GB menjadi 4GB dengan menghapus bukti MTP dari blok lama.
  rebrand: Rebrand (selesai)
  lelantus: Aktivasi Lelantus (selesai)
  lelantusdesc: Lelantus adalah protokol privasi generasi berikutnya kami yang menawarkan tingkat privasi praktis tertinggi tanpa setup terpercaya dan hanya mengandalkan asumsi kriptografi yang solid. Lelantus mendukung set anonimitas yang besarnya beberapa kali lipat lebih besar daripada sistem privasi lain yang tidak memiliki setup terpercaya.
  chainlocks: Chainlocks (selesai)
  chainlocksdesc: Chainlocks memanfaatkan jaringan masternode Firo untuk melindungi dari serangan 51%. Transaksi mencapai finalitas segera setelah 1 blok dikonfirmasi.
  rap: Alamat RAP (selesai)
  rapdesc: Alamat RAP memungkinkan alamat yang dapat dibagikan secara publik yang tidak memungkinkan pihak ketiga melihat berapa banyak atau kapan dana diterima.
  instant: Instant Send (selesai)
  instantdesc: Instant Send memanfaatkan jaringan masternode Firo untuk memungkinkan transaksi dikonfirmasi dalam beberapa detik sehingga memungkinkan penggunaan praktis sebagai media pertukaran.
  elysium: Elysium (di Testnet)
  elysiumdesc: Elysium memungkinkan token (misalnya stablecoin, koin berbasis aset) diterbitkan di jaringan Firo yang akan mendapat manfaat dari teknologi privasi Firo.
  elysiumv2: Elysium v2
  elysiumv2desc: Elysium v2 memperluas kemampuan Elysium dengan bridging yang lebih mudah dan kemampuan DeFi. Elysium v2 juga akan mengimplementasikan Spats yang akan menyembunyikan jenis aset yang ditransfer.
  lelantusspark: Lelantus Spark (selesai)
  lelantussparkdesc: Lelantus Spark memungkinkan pembayaran anonim langsung yang memungkinkan pengguna bertransaksi satu sama lain tanpa mengungkapkan jumlah, sumber, dan penerima. Spark memperkenalkan alamat Spark yang akan memungkinkan pengguna menjaga dana mereka sepenuhnya tersembunyi bersama dengan dukungan kunci lihat penuh dan multisig ambang.
  mobile: Dompet Seluler (selesai)
  mobiledesc: Dompet seluler native, privat secara default yang akan memiliki dukungan penuh transaksi Lelantus.
  firopow: FiroPoW (selesai)
  firopowdesc: FiroPoW adalah varian ProgPOW yang dirancang untuk GPU dan memiliki ketahanan ASIC yang kuat.
  research: Riset
  lelantussparkaddress: Sub-addressing Lelantus Spark dan bukti pembayaran (selesai)
  lelantussparkaddressdesc: Lelantus Spark akan mendukung sub-address yang memungkinkan pemindaian lebih efisien dan bukti pembayaran yang memungkinkan pengguna membuktikan bahwa mereka melakukan pembayaran.
  firodex: FiroDEX (selesai)
  firodexdesc: FiroDEX memungkinkan pengguna menukar ke dan dari Firo menggunakan infrastruktur terdesentralisasi menggunakan teknologi atomic swap.
  bridges: Jembatan lintas rantai
  bridgesdesc: Jembatan lintas rantai akan memungkinkan token dari ekosistem lain untuk menjembatani masuk dan keluar dari lapisan token Elysium Firo untuk memanfaatkan infrastruktur privasi kami.
  mixnets: Mixnet
  mixnetsdesc: Menerowongkan transaksi dan komunikasi node ke dalam mixnet menawarkan peningkatan perlindungan metadata bahkan terhadap musuh tingkat negara. Kami sedang menyelidiki mixnet Meson yang dibangun di atas pustaka perangkat lunak Katzenpost.
  spats: Spark Assets (selesai)
  spatsdesc: Spark Assets memperluas fungsionalitas Spark untuk menyembunyikan jenis aset yang ditransfer. Spats direncanakan untuk diimplementasikan di Elysium v2.
  syncclients: Klien sinkronisasi cepat
  syncclientsdesc: Klien sinkronisasi cepat memungkinkan pengguna menyinkronkan dompet mereka dengan cepat tanpa perlu mengunduh seluruh blockchain sambil mendukung transaksi Lelantus.
  learnmore: Pelajari lebih lanjut

