home:
  heading: Memulai <br class="brmob">revolusi privasi
  heading2: Firo adalah mata uang kripto yang menjaga privasi <br>dan ekosistemnya.
  cta1: Dapatkan Firo
  cta2: Pelajari lebih lanjut
  about: Cara kerja Firo
  aboutp: Firo unggul dengan memimpin inovasi privasi dan protokol. Riset perintis kami berfokus pada bagaimana privasi seharusnya bekerja dalam keuangan digital.
  privacy: Privasi
  privacy1: Firo mengembangkan Lelantus Spark yang menyediakan privasi on-chain tanpa perlu kepercayaan dengan set anonimitas yang tinggi. Teknologi Dandelion++ memberikan privasi di lapisan jaringan.
  privacy2: set anonimitas
  privacy3: tanpa setup terpercaya
  blockchain: Blockchain
  blockchain1: Sistem hybrid PoW dan LLMQ Chainlocks kami melindungi dari serangan 51% sekaligus memastikan finalitas blok dan transaksi yang hampir instan, menjadikan Firo pilihan ideal untuk pembayaran yang aman dan efisien.
  blockchain2: total pasokan + emisi ekor
  blockchain3: proof of work
  blockchain4: masternode
  privacyin: Infrastruktur Privasi
  privacyin1: Dengan Spark Assets, Firo memperluas privasi tidak hanya pada transaksi tetapi juga pada aset itu sendiri. Fitur ini menyembunyikan jenis aset yang ditransfer, sehingga cocok untuk membuat token yang berfokus pada privasi yang dapat digunakan dalam aplikasi aman dan anonim seperti voting atau aset token privat.
  randd: Penelitian dan Pengembangan
  randd1: Firo menonjol sebagai salah satu dari sedikit proyek yang menyumbang riset independen untuk teknologi privasi blockchain dan desentralisasi seperti Zerocoin, Sigma, Lelantus, Lelantus Spark, dan MTP. Karya kami telah memainkan peran penting di bidang ini, memengaruhi atau diadopsi oleh proyek lain.
  getfiro: Dapatkan Firo
  getfiro1: Beli, tambang, atau dapatkan Firo, dan bergabunglah dalam revolusi privasi. <br>Simpan Firo Anda di salah satu dompet kami yang kaya fitur, dioptimalkan untuk kekuatan, aksesibilitas, dan pengalaman pengguna.
  getfiro2: Dapatkan dompet
  getfiro2text: Firo memiliki beberapa opsi untuk mengelola dana Anda di OS desktop dan seluler utama. Pilih yang paling cocok untuk Anda.
  getfiro2link: Unduh dompet
  getfiro3: Beli Firo
  getfiro3text: Firo memiliki beberapa opsi untuk mengelola dana Anda di OS desktop dan seluler utama. Pilih yang paling cocok untuk Anda.
  getfiro3link: Cari bursa
  getfiro4: Dapatkan Firo
  getfiro4text: Anda dapat menyiapkan masternode Firo Anda sendiri untuk mendapatkan Firo. Kami memandu Anda melalui proses penyiapan dalam panduan terperinci kami.
  getfiro4link: Siapkan masternode
  getfiro5: Mulai menambang
  getfiro5text: FiroPoW, algoritma penambangan Firo, dirancang untuk ditambang dengan GPU. Ikuti panduan kami untuk mulai menambang Firo pertama Anda.
  getfiro5link: Baca panduan menambang

